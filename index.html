<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ग्राम पंचायत सरपंच चुनाव पोल</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .poll-container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h2 {
            color: #1a1a1a;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .meta-info {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        .choice-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .email-box {
            margin-bottom: 20px;
        }
        .email-box label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .email-box input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .email-box input:focus {
            border-color: #4f46e5;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-item:hover {
            border-color: #4f46e5;
            background-color: #fafafe;
        }
        .option-item input {
            margin-right: 12px;
            transform: scale(1.2);
            accent-color: #4f46e5;
        }
        .option-label {
            font-size: 16px;
            color: #2d3748;
            font-weight: 500;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-vote {
            background-color: #4f46e5;
            color: white;
            flex: 1;
        }
        .btn-vote:hover {
            background-color: #4338ca;
        }
        .btn-results, .btn-share {
            background-color: #ffffff;
            color: #4b5563;
            border: 1px solid #d1d5db;
        }
        .btn-results:hover, .btn-share:hover {
            background-color: #f3f4f6;
        }
        
        /* Results & Bar Chart Styling */
        .results-container {
            margin-top: 20px;
            display: none;
        }
        .result-bar-item {
            margin-bottom: 12px;
        }
        .result-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 5px;
        }
        .bar-background {
            background-color: #e5e7eb;
            border-radius: 6px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }
        .bar-fill {
            background-color: #4f46e5;
            height: 100%;
            width: 0%;
            transition: width 0.8s ease-in-out;
            border-radius: 6px;
        }
        .alert-msg {
            background-color: #ecfdf5;
            color: #065f46;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid #a7f3d0;
            display: none;
        }
        .privacy-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            border-top: 1px dashed #e5e7eb;
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="poll-container">
    <h2>ग्राम पंचायत बाग से अगला सरपंच कौन होगा?</h2>
    <div class="meta-info">एक अतिथि द्वारा · अभी-अभी</div>

    <div id="alertBox" class="alert-msg"></div>

    <!-- Voting Form Section -->
    <div id="votingSection">
        <div class="email-box">
            <label for="voterEmail">अपनी ईमेल आईडी दर्ज करें (एक ईमेल से केवल 1 वोट मान्य):</label>
            <input type="email" id="voterEmail" placeholder="example@gmail.com" required>
        </div>

        <div class="choice-title">अपना एक विकल्प चुनें:</div>
        <div class="options-list" id="optionsList">
            <!-- Options will be loaded dynamically via script -->
        </div>

        <div class="btn-group">
            <button class="btn btn-vote" onclick="submitVote()">वोट दें →</button>
            <button class="btn btn-results" onclick="showResultsView()">परिणाम देखें</button>
            <button class="btn btn-share" onclick="sharePoll()">शेयर करें</button>
        </div>
    </div>

    <!-- Live Results Section -->
    <div id="resultsSection" class="results-container">
        <div class="choice-title" id="resultsTitle">लाइव परिणाम (कुल वोट: <span id="totalVotesCount">0</span>)</div>
        <div id="barChartsList"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn btn-results" id="backToVoteBtn" onclick="toggleVotingView()" style="flex: 1;">← वोट पर वापस जाएं</button>
        </div>
    </div>

    <!-- Privacy Assurance Line -->
    <div class="privacy-footer">
        🔒 घबराएं नहीं, आपका डेटा पूरी तरह से प्राइवेट रखा जाएगा।
    </div>
</div>

<script>
    const candidates = [
        "सोनू (मोहित गोठड़िया)",
        "पूनम (विकास)",
        "सरोज (राकेश)",
        "सरोज (प्रभु)",
        "इंद्रावती (माडू मास्टर)",
        "सुमन (रामनिवास)"
    ];

    // Sabhi ke votes shuruat me 0 se set kiye gaye hain
    if (!localStorage.getItem('poll_votes_zero')) {
        const initialVotes = {
            "सोनू (मोहित गोठड़िया)": 0,
            "पूनम (विकास)": 0,
            "सरोज (राकेश)": 0,
            "सरोज (प्रभु)": 0,
            "इंद्रावती (माडू मास्टर)": 0,
            "सुमन (रामनिवास)": 0
        };
        localStorage.setItem('poll_votes_zero', JSON.stringify(initialVotes));
    }

    if (!localStorage.getItem('voted_emails_zero')) {
        localStorage.setItem('voted_emails_zero', JSON.stringify([]));
    }

    function renderOptions() {
        const listDiv = document.getElementById('optionsList');
        listDiv.innerHTML = '';
        candidates.forEach((cand) => {
            listDiv.innerHTML += `
                <label class="option-item">
                    <input type="radio" name="pollOption" value="${cand}">
                    <span class="option-label">${cand}</span>
                </label>
            `;
        });
    }

    function updateCharts() {
        const votes = JSON.parse(localStorage.getItem('poll_votes_zero'));
        let total = 0;
        for (let key in votes) {
            total += votes[key];
        }
        document.getElementById('totalVotesCount').innerText = total;

        const chartsDiv = document.getElementById('barChartsList');
        chartsDiv.innerHTML = '';

        candidates.forEach(cand => {
            const count = votes[cand] || 0;
            const percentage = total > 0 ? ((count / total) * 100).toFixed(1) : 0;

            chartsDiv.innerHTML += `
                <div class="result-bar-item">
                    <div class="result-info">
                        <span>${cand}</span>
                        <span>${count} वोट (${percentage}%)</span>
                    </div>
                    <div class="bar-background">
                        <div class="bar-fill" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        });
    }

    function submitVote() {
        const emailInput = document.getElementById('voterEmail').value.trim();
        const selected = document.querySelector('input[name="pollOption"]:checked');
        const alertBox = document.getElementById('alertBox');

        // Email validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailInput || !emailRegex.test(emailInput)) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = '#fef2f2';
            alertBox.style.color = '#991b1b';
            alertBox.style.borderColor = '#f87171';
            alertBox.innerText = 'कृपया अपनी सही ईमेल आईडी दर्ज करें!';
            return;
        }

        if (!selected) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = '#fef2f2';
            alertBox.style.color = '#991b1b';
            alertBox.style.borderColor = '#f87171';
            alertBox.innerText = 'कृपया वोट देने के लिए किसी एक उम्मीदवार को चुनें!';
            return;
        }

        // Check if email already voted
        let votedEmails = JSON.parse(localStorage.getItem('voted_emails_zero'));
        if (votedEmails.includes(emailInput.toLowerCase())) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = '#fef3c7';
            alertBox.style.color = '#92400e';
            alertBox.style.borderColor = '#fde68a';
            alertBox.innerText = 'इस ईमेल आईडी से पहले ही वोट दिया जा चुका है! एक ईमेल से केवल एक ही वोट मान्य है।';
            showResultsView();
            return;
        }

        // Save vote and increment by 1
        const choice = selected.value;
        const votes = JSON.parse(localStorage.getItem('poll_votes_zero'));
        votes[choice] = (votes[choice] || 0) + 1;
        localStorage.setItem('poll_votes_zero', JSON.stringify(votes));

        // Add email to voted list
        votedEmails.push(emailInput.toLowerCase());
        localStorage.setItem('voted_emails_zero', JSON.stringify(votedEmails));

        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = '#ecfdf5';
        alertBox.style.color = '#065f46';
        alertBox.style.borderColor = '#a7f3d0';
        alertBox.innerText = 'आपका वोट सफलतापूर्वक दर्ज कर लिया गया है!';

        showResultsView();
    }

    function showResultsView() {
        document.getElementById('votingSection').style.display = 'none';
        document.getElementById('resultsSection').style.display = 'block';
        updateCharts();
    }

    function toggleVotingView() {
        document.getElementById('resultsSection').style.display = 'none';
        document.getElementById('votingSection').style.display = 'block';
        document.getElementById('alertBox').style.display = 'none';
    }

    function sharePoll() {
        if (navigator.share) {
            navigator.share({
                title: 'ग्राम पंचायत सरपंच चुनाव पोल',
                text: 'देखिए गाँव के अगले सरपंच के लिए लाइव पोलिंग और अपना वोट दीजिए:',
                url: window.location.href,
            }).catch(() => {});
        } else {
            prompt('ये रहा पोल का लिंक, इसे कॉपी करके व्हाट्सएप पर शेयर करें:', window.location.href);
        }
    }

    window.onload = function() {
        renderOptions();
        updateCharts();
    };
</script>

</body>
</html>
