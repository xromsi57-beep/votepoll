<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ग्राम पंचायत सरपंच चुनाव पोल</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .poll-container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h2 {
            color: #1a1a1a;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .meta-info {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        .choice-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .email-box {
            margin-bottom: 20px;
        }
        .email-box label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .email-box input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .email-box input:focus {
            border-color: #4f46e5;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-item:hover {
            border-color: #4f46e5;
            background-color: #fafafe;
        }
        .option-item input {
            margin-right: 12px;
            transform: scale(1.2);
            accent-color: #4f46e5;
        }
        .option-label {
            font-size: 16px;
            color: #2d3748;
            font-weight: 500;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-vote {
            background-color: #4f46e5;
            color: white;
            flex: 1;
        }
        .btn-vote:hover {
            background-color: #4338ca;
        }
        .btn-results, .btn-share {
            background-color: #ffffff;
            color: #4b5563;
            border: 1px solid #d1d5db;
        }
        .btn-results:hover, .btn-share:hover {
            background-color: #f3f4f6;
        }
        
        .results-container {
            margin-top: 20px;
            display: none;
        }
        .result-bar-item {
            margin-bottom: 12px;
        }
        .result-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 5px;
        }
        .bar-background {
            background-color: #e5e7eb;
            border-radius: 6px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }
        .bar-fill {
            background-color: #4f46e5;
            height: 100%;
            width: 0%;
            transition: width 0.8s ease-in-out;
            border-radius: 6px;
        }
        .alert-msg {
            background-color: #ecfdf5;
            color: #065f46;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid #a7f3d0;
            display: none;
        }
        .privacy-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            border-top: 1px dashed #e5e7eb;
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="poll-container">
    <h2>ग्राम पंचायत बाग से अगला सरपंच कौन होगा?</h2>
    <div class="meta-info">लाइव डेटाबेस कनेक्टेड · गूगल शीट + लोकल स्टैक</div>

    <div id="alertBox" class="alert-msg"></div>

    <!-- Voting Form Section -->
    <div id="votingSection">
        <div class="email-box">
            <label for="voterEmail">अपनी ईमेल आईडी दर्ज करें (एक ईमेल से केवल 1 वोट मान्य):</label>
            <input type="email" id="voterEmail" placeholder="example@gmail.com" required>
        </div>

        <div class="choice-title">अपना एक विकल्प चुनें:</div>
        <div class="options-list" id="optionsList"></div>

        <div class="btn-group">
            <button class="btn btn-vote" id="voteBtn" onclick="submitVote()">वोट दें →</button>
            <button class="btn btn-results" onclick="showResultsView()">परिणाम देखें</button>
            <button class="btn btn-share" onclick="sharePoll()">शेयर करें</button>
        </div>
    </div>

    <!-- Live Results Section -->
    <div id="resultsSection" class="results-container">
        <div class="choice-title" id="resultsTitle">लाइव परिणाम (कुल वोट: <span id="totalVotesCount">0</span>)</div>
        <div id="barChartsList"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn btn-results" onclick="toggleVotingView()" style="flex: 1;">← वोट पर वापस जाएं</button>
            <button class="btn btn-results" onclick="syncAndRefresh()" style="background: #f3f4f6;">🔄 रिफ्रेश करें</button>
        </div>
    </div>

    <div class="privacy-footer">
        🔒 डेटा स्टैक मेमोरी और गूगल शीट में सुरक्षित रूप से सिंक किया जा रहा है।
    </div>
</div>

<script>
    const candidates = [
        "सोनू (मोहित गोठड़िया)",
        "पूनम (विकास)",
        "सरोज (राकेश)",
        "सरोज (प्रभु)",
        "इंद्रावती (माडू मास्टर)",
        "सुमन (रामनिवास)"
    ];

    const SHEETDB_API_URL = "https://sheetdb.io/api/v1/s1s6dqlqlszr6";

    // Global Stack / Array to hold all votes locally for instant updates
    let voteStack = [];

    function renderOptions() {
        const listDiv = document.getElementById('optionsList');
        listDiv.innerHTML = '';
        candidates.forEach((cand) => {
            listDiv.innerHTML += `
                <label class="option-item">
                    <input type="radio" name="pollOption" value="${cand}">
                    <span class="option-label">${cand}</span>
                </label>
            `;
        });
    }

    // Sheet aur Local Stack ko sync karne ka function
    async function syncAndRefresh() {
        try {
            let response = await fetch(SHEETDB_API_URL);
            let rows = await response.json();
            
            if (Array.isArray(rows)) {
                voteStack = []; // Stack reset karke sheet ka latest data daalenge
                rows.forEach(row => {
                    let email = row.email || row.Email || row.EMAIL;
                    let cand = row.candidate || row.Candidate || row.CANDIDATE;
                    let time = row.timestamp || row.Timestamp || "";

                    if (email && cand) {
                        let matched = candidates.find(c => c.toLowerCase() === cand.trim().toLowerCase() || c.includes(cand.trim()) || cand.trim().includes(c));
                        if (matched) {
                            voteStack.push({ email: email.trim().toLowerCase(), candidate: matched, timestamp: time });
                        }
                    }
                });
            }
        } catch (error) {
            console.log("Using local stack memory due to network/sheet delay.");
        }

        updateUIFromStack();
    }

    // Stack ke data se UI (Votes Count & Percentage) calculate aur update karna
    function updateUIFromStack() {
        let votes = {
            "सोनू (मोहित गोठड़िया)": 0,
            "पूनम (विकास)": 0,
            "सरोज (राकेश)": 0,
            "सरोज (प्रभु)": 0,
            "इंद्रावती (माडू मास्टर)": 0,
            "सुमन (रामनिवास)": 0
        };

        let votedEmails = [];

        // Stack ko loop karke votes count karna
        voteStack.forEach(vote => {
            if (votes[vote.candidate] !== undefined) {
                votes[vote.candidate] += 1;
                votedEmails.push(vote.email);
            }
        });

        window.cachedVotes = votes;
        window.cachedVotedEmails = votedEmails;
        let total = voteStack.length;
        document.getElementById('totalVotesCount').innerText = total;

        const chartsDiv = document.getElementById('barChartsList');
        chartsDiv.innerHTML = '';

        candidates.forEach(cand => {
            const count = votes[cand] || 0;
            const percentage = total > 0 ? ((count / total) * 100).toFixed(1) : 0;

            chartsDiv.innerHTML += `
                <div class="result-bar-item">
                    <div class="result-info">
                        <span>${cand}</span>
                        <span>${count} वोट (${percentage}%)</span>
                    </div>
                    <div class="bar-background">
                        <div class="bar-fill" style="width: ${percentage}%"></div>
                    </div>
                </div>
            `;
        });
    }

    async function submitVote() {
        const emailInput = document.getElementById('voterEmail').value.trim().toLowerCase();
        const selected = document.querySelector('input[name="pollOption"]:checked');
        const voteBtn = document.getElementById('voteBtn');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailInput || !emailRegex.test(emailInput)) {
            showAlert('#fef2f2', '#991b1b', '#f87171', 'कृपया अपनी सही ईमेल आईडी दर्ज करें!');
            return;
        }

        if (!selected) {
            showAlert('#fef2f2', '#991b1b', '#f87171', 'कृपया वोट देने के लिए किसी एक उम्मीदवार को चुनें!');
            return;
        }

        // Check if email already exists in stack
        let votedEmails = window.cachedVotedEmails || [];
        if (votedEmails.includes(emailInput)) {
            showAlert('#fef3c7', '#92400e', '#fde68a', 'इस ईमेल आईडी से पहले ही वोट दिया जा चुका है! एक ईमेल से केवल एक ही वोट मान्य है।');
            showResultsView();
            return;
        }

        voteBtn.innerText = 'वोट दर्ज हो रहा है...';
        voteBtn.disabled = true;

        const choice = selected.value;
        const newVote = {
            email: emailInput,
            candidate: choice,
            timestamp: new Date().toLocaleString()
        };

        // 1. Stack me turant push karo (Instant local update)
        voteStack.push(newVote);
        updateUIFromStack();

        // 2. SheetDB par background me bhejo
        const postData = {
            data: [
                {
                    "email": newVote.email,
                    "candidate": newVote.candidate,
                    "timestamp": newVote.timestamp
                }
            ]
        };

        try {
            await fetch(SHEETDB_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(postData)
            });
        } catch (error) {
            console.log("Background sheet sync error:", error);
        }

        showAlert('#ecfdf5', '#065f46', '#a7f3d0', 'आपका वोट सफलतापूर्वक दर्ज कर लिया गया है!');
        document.getElementById('voterEmail').value = '';
        showResultsView();

        voteBtn.innerText = 'वोट दें →';
        voteBtn.disabled = false;
    }

    function showAlert(bgColor, textColor, borderColor, message) {
        const alertBox = document.getElementById('alertBox');
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = bgColor;
        alertBox.style.color = textColor;
        alertBox.style.borderColor = borderColor;
        alertBox.innerText = message;
    }

    function showResultsView() {
        document.getElementById('votingSection').style.display = 'none';
        document.getElementById('resultsSection').style.display = 'block';
        updateUIFromStack();
    }

    function toggleVotingView() {
        document.getElementById('resultsSection').style.display = 'none';
        document.getElementById('votingSection').style.display = 'block';
        document.getElementById('alertBox').style.display = 'none';
    }

    function sharePoll() {
        if (navigator.share) {
            navigator.share({
                title: 'ग्राम पंचायत सरपंच चुनाव पोल',
                text: 'देखिए गाँव के अगले सरपंच के लिए लाइव पोलिंग और अपना वोट दीजिए:',
                url: window.location.href,
            }).catch(() => {});
        } else {
            prompt('ये रहा पोल का लिंक, इसे कॉपी करके शेयर करें:', window.location.href);
        }
    }

    window.onload = function() {
        renderOptions();
        syncAndRefresh();
    };
</script>

</body>
</html>
